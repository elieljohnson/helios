<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Helios — Unified Home Energy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EDE7DC; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  #root { min-height: 100vh; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="flow-viz.jsx"></script>
<script type="text/babel" src="cards.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
function Root() {
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <DesignCanvas>
        <DCSection id="directions" title="Helios — Bar (legible alternative)"
          subtitle="Horizontal producing/consuming bars. Same interaction model — tabs, cards, scrubber, reserve override — with a calmer, more data-forward flow viz.">

          <DCArtboard id="bar" label="D · Bar — legible alternate" width={440} height={912}>
            <HeliosApp frame={true} variant="bar" scenario={t.scenario} dark={t.dark} density={t.density} hueShift={t.hueShift} />
          </DCArtboard>

          <DCPostIt top={-32} right={60} width={220} rotate={2}>
            Live prototype. Open in focus mode (↗) to interact with tabs, cards, the time scrubber, and the reserve override.
          </DCPostIt>
        </DCSection>

        <DCSection id="desktop" title="Desktop PWA layout"
          subtitle="Same design system. Hero top, cards in a responsive grid. Helios renders identically at any breakpoint — the native rebuild is where craft compounds.">
          <DCArtboard id="desktop-v" label="Desktop · 1200" width={1200} height={820}>
            <DesktopView variant="bar" scenario={t.scenario} dark={t.dark} density={t.density} hueShift={t.hueShift} />
          </DCArtboard>
        </DCSection>

        <DCSection id="native-preview" title="Native-iOS preview (Phase 2)"
          subtitle="Platform features the PWA can't do — widgets, Dynamic Island, StandBy. Shown here as design targets.">
          <DCArtboard id="widgets" label="Widgets + lockscreen" width={440} height={640}>
            <NativePreview dark={t.dark} scenario={t.scenario} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks — Helios">
        <TweakSection label="System state">
          <TweakRadio label="Scenario" value={t.scenario}
            options={[
              {value:'optimized', label:'Optimized'},
              {value:'charging',  label:'Charging'},
              {value:'peak',      label:'Peak'},
            ]}
            onChange={(v) => setT('scenario', v)} />
        </TweakSection>
        <TweakSection label="Theme">
          <TweakToggle label="Dark" value={t.dark} onChange={(v) => setT('dark', v)} />
          <TweakSlider label="Hue shift" value={t.hueShift} min={-40} max={40} step={2} unit="°"
            onChange={(v) => setT('hueShift', v)} />
          <TweakRadio label="Density" value={t.density}
            options={[{value:'comfortable',label:'Comfort'},{value:'compact',label:'Compact'}]}
            onChange={(v) => setT('density', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

// ─────────────────────────────────────────────
// Desktop view — dashboard grid using same components
// ─────────────────────────────────────────────
function DesktopView({ variant, scenario, dark, density, hueShift }) {
  const state = React.useMemo(() => HELIOS_DATA.scenarios[scenario] || HELIOS_DATA.scenarios.optimized, [scenario]);
  const [focus, setFocus] = React.useState(null);
  return (
    <div className={`helios theme-${dark?'dark':'light'} density-${density||'comfortable'}`}
      style={{ minHeight: '100%', background: 'var(--surface-warm)', padding: 40, filter: hueShift ? `hue-rotate(${hueShift}deg)` : 'none' }}>
      {/* Top bar */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 28 }}>
        <div style={{ width: 26, height: 26, borderRadius: 7, background: 'var(--solar)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ color: '#fff', fontSize: 14, fontWeight: 700 }}>☼</div>
        </div>
        <div style={{ fontSize: 17, fontWeight: 600, letterSpacing: '-0.01em' }}>Helios</div>
        <div style={{ fontSize: 12, color: 'var(--text-tertiary)', letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 600 }}>
          · {HELIOS_DATA.system.location} · {HELIOS_DATA.system.utility}
        </div>
      </div>

      {/* Two-column responsive layout */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 20, alignItems: 'start' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          <div className="h-card" style={{ padding: 32, display: 'flex', flexDirection: 'column', alignItems: 'stretch', gap: 20 }}>
            <div>
              <div style={{ fontSize: 11, color: 'var(--text-tertiary)', letterSpacing: '0.1em', textTransform: 'uppercase', fontWeight: 600, marginBottom: 6 }}>
                {state.status_word} · self-sufficient today
              </div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
                <span className="h-hero" style={{ fontSize: 96, color: state.status_word === 'Alert' ? 'var(--alert)' : 'var(--battery)', lineHeight: 0.9 }}>
                  <AnimatedNumber value={state.self_sufficiency} decimals={0} />
                </span>
                <span className="h-hero" style={{ fontSize: 36, color: state.status_word === 'Alert' ? 'var(--alert)' : 'var(--battery)', opacity: 0.6 }}>%</span>
              </div>
            </div>
            <div>
              <FlowViz variant={variant} state={state} size={360} focus={focus} onNodeTap={(k) => setFocus(focus===k?null:k)} />
            </div>
          </div>
          <SolarCard state={state} expanded={true} />
          <PowerwallCard state={state} expanded={true} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          <CostCard state={state} expanded={true} />
          <EVCard state={state} expanded={true} />
          <WeatherCard state={state} />
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// Native preview — lockscreen, home widget, Dynamic Island
// ─────────────────────────────────────────────
function NativePreview({ dark = true, scenario = 'optimized' }) {
  const state = HELIOS_DATA.scenarios[scenario] || HELIOS_DATA.scenarios.optimized;
  const circ = 2 * Math.PI * 28;
  const bg = dark ? '#0C1220' : '#F5F1EB';
  const fg = dark ? '#F1F5F9' : '#1A1D23';
  return (
    <div style={{ background: bg, color: fg, padding: 26, minHeight: '100%', fontFamily: 'Inter, system-ui', display: 'flex', flexDirection: 'column', gap: 22 }}>
      <div style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: dark ? '#94A3B8' : '#5D6670', fontWeight: 600 }}>
        Native iOS — Phase 2 design targets
      </div>

      {/* Dynamic Island */}
      <div>
        <Label>Dynamic Island · active charging</Label>
        <div style={{
          width: 280, height: 37, borderRadius: 24, background: '#000',
          margin: '8px auto 0', display: 'flex', alignItems: 'center', padding: '0 14px', gap: 10,
        }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" strokeWidth="2"><path d="M5 17h14M6 17v3M18 17v3M3 13l2-5a3 3 0 013-2h8a3 3 0 013 2l2 5v4H3v-4z"/></svg>
          <span style={{ color: '#fff', fontSize: 12, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>62% · +25 mi/h</span>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6 }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#F5A623"><circle cx="12" cy="12" r="5"/></svg>
            <span style={{ color: '#F5A623', fontSize: 12, fontWeight: 600 }}>88%</span>
          </div>
        </div>
      </div>

      {/* Lock screen widget */}
      <div>
        <Label>Lockscreen — circular gauge</Label>
        <div style={{ display: 'flex', gap: 20, marginTop: 10 }}>
          <div style={{ width: 84, height: 84, borderRadius: 20, background: dark ? '#1A2332' : '#fff', padding: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
            <svg width="68" height="68" viewBox="0 0 68 68">
              <circle cx="34" cy="34" r="28" fill="none" stroke={dark ? '#243044' : '#F0EAE0'} strokeWidth="5" />
              <circle cx="34" cy="34" r="28" fill="none" stroke="#2FAE7A" strokeWidth="5" strokeLinecap="round"
                strokeDasharray={`${circ * 0.87} ${circ}`} transform="rotate(-90 34 34)" />
              <text x="34" y="38" textAnchor="middle" fontSize="16" fontWeight="700" fill={fg}
                fontFamily="Inter, system-ui" style={{ fontVariantNumeric: 'tabular-nums' }}>87%</text>
            </svg>
          </div>
          <div style={{ width: 84, height: 84, borderRadius: 20, background: dark ? '#1A2332' : '#fff', padding: 10, display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
            <div style={{ fontSize: 9, color: '#F5A623', fontWeight: 700, letterSpacing: '0.12em' }}>SOLAR</div>
            <div style={{ fontSize: 26, fontWeight: 700, fontFamily: 'Inter Display, Inter', fontVariantNumeric: 'tabular-nums', lineHeight: 1 }}>7.7</div>
            <div style={{ fontSize: 10, color: dark ? '#94A3B8' : '#5D6670', fontFamily: 'JetBrains Mono, monospace' }}>kW · peak 9.5</div>
          </div>
        </div>
      </div>

      {/* Home screen widget — chip row */}
      <div>
        <Label>Home screen widget — 4-point summary</Label>
        <div style={{ marginTop: 10, width: 340, borderRadius: 22, background: dark ? '#1A2332' : '#fff', padding: 18, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
          {[
            { label: 'SOLAR', value: '7.7', unit: 'kW', color: '#F5A623' },
            { label: 'EV',    value: '62',  unit: '%',  color: '#2DD4BF' },
            { label: 'PW',    value: '78',  unit: '%',  color: '#2FAE7A' },
            { label: 'HOME',  value: '1.4', unit: 'kW', color: '#A78BFA' },
          ].map((s, i) => (
            <div key={i}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                <span style={{ width: 6, height: 6, borderRadius: 3, background: s.color }} />
                <span style={{ fontSize: 10, color: s.color, fontWeight: 700, letterSpacing: '0.1em' }}>{s.label}</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                <span style={{ fontSize: 26, fontWeight: 700, fontFamily: 'Inter Display, Inter', fontVariantNumeric: 'tabular-nums', lineHeight: 1 }}>{s.value}</span>
                <span style={{ fontSize: 12, color: dark ? '#94A3B8' : '#5D6670' }}>{s.unit}</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ marginTop: 'auto', fontSize: 11, color: dark ? '#475569' : '#99A0A8', lineHeight: 1.5 }}>
        Widgets, Dynamic Island, and haptics are native-only. PWA ships everything else against the same /api/status endpoint.
      </div>
    </div>
  );

  function Label({ children }) {
    return <div style={{ fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase', color: dark ? '#94A3B8' : '#5D6670', fontWeight: 600 }}>{children}</div>;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
