<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#5D6670"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#3A7BD1"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#F5F1EB"/>

  <text x="60" y="68" font-size="14" font-weight="600" fill="#5D6670" letter-spacing="2.4">DIAGRAM 1 · THE HOME SYSTEM</text>
  <text x="60" y="108" font-size="34" font-weight="700" fill="#1A1D23">Four assets, one orchestration layer</text>
  <text x="60" y="140" font-size="16" fill="#5D6670">Helios reads from each asset's vendor cloud and writes only where pairing allows.</text>

  <!-- Solar -->
  <g transform="translate(120,220)">
    <rect width="220" height="140" rx="20" fill="#FFFFFF" stroke="rgba(28,24,16,0.16)"/>
    <circle cx="28" cy="34" r="6" fill="#E89A2B"/>
    <text x="44" y="40" font-size="13" font-weight="700" fill="#E89A2B" letter-spacing="1.6">SOLAR</text>
    <text x="20" y="80" font-size="22" font-weight="700" fill="#1A1D23">35× REC 460W</text>
    <text x="20" y="106" font-size="13" fill="#5D6670">16.1 kW DC nameplate</text>
    <text x="20" y="124" font-size="13" fill="#5D6670">13.3 kW AC clip ceiling</text>
  </g>

  <!-- Powerwall -->
  <g transform="translate(380,220)">
    <rect width="220" height="140" rx="20" fill="#FFFFFF" stroke="rgba(28,24,16,0.16)"/>
    <circle cx="28" cy="34" r="6" fill="#2FAE7A"/>
    <text x="44" y="40" font-size="13" font-weight="700" fill="#2FAE7A" letter-spacing="1.6">POWERWALL</text>
    <text x="20" y="80" font-size="22" font-weight="700" fill="#1A1D23">2× PW3 + Exp.</text>
    <text x="20" y="106" font-size="13" fill="#5D6670">40.5 kWh storage</text>
    <text x="20" y="124" font-size="13" fill="#5D6670">Full-house backup</text>
  </g>

  <!-- Wall Connector -->
  <g transform="translate(640,220)">
    <rect width="220" height="140" rx="20" fill="#FFFFFF" stroke="rgba(28,24,16,0.16)"/>
    <circle cx="28" cy="34" r="6" fill="#8B1A3F"/>
    <text x="44" y="40" font-size="13" font-weight="700" fill="#8B1A3F" letter-spacing="1.6">WALL CONNECTOR</text>
    <text x="20" y="80" font-size="22" font-weight="700" fill="#1A1D23">Tesla Universal</text>
    <text x="20" y="106" font-size="13" fill="#5D6670">Live charge telemetry</text>
    <text x="20" y="124" font-size="13" fill="#5D6670">via Tesla Fleet API</text>
  </g>

  <!-- EV -->
  <g transform="translate(900,220)">
    <rect width="220" height="140" rx="20" fill="#FFFFFF" stroke="rgba(28,24,16,0.16)"/>
    <circle cx="28" cy="34" r="6" fill="#0E8AA8"/>
    <text x="44" y="40" font-size="13" font-weight="700" fill="#0E8AA8" letter-spacing="1.6">EV</text>
    <text x="20" y="80" font-size="22" font-weight="700" fill="#1A1D23">Rivian R1S</text>
    <text x="20" y="106" font-size="13" fill="#5D6670">2025, Gen 2</text>
    <text x="20" y="124" font-size="13" fill="#5D6670">135 kWh, 11 kW max</text>
  </g>

  <!-- Helios layer -->
  <g transform="translate(120,520)">
    <rect width="1000" height="120" rx="24" fill="#1A1D23"/>
    <text x="32" y="44" font-size="13" font-weight="700" fill="#E89A2B" letter-spacing="1.8">HELIOS · DECISION ENGINE</text>
    <text x="32" y="80" font-size="22" font-weight="700" fill="#FFFFFF">Reads every 5 minutes from four vendor clouds.</text>
    <text x="32" y="104" font-size="14" fill="rgba(255,255,255,0.65)">Tesla Fleet API · Enphase Enlighten · Rivian GraphQL · Smartcar V3 · Open-Meteo forecast</text>
  </g>

  <!-- Data flow arrows: assets down to Helios -->
  <g stroke="#3A7BD1" stroke-width="1.8" stroke-dasharray="4 4" fill="none" opacity="0.7">
    <path d="M 230 360 L 230 520" marker-end="url(#arrow-data)"/>
    <path d="M 490 360 L 490 520" marker-end="url(#arrow-data)"/>
    <path d="M 750 360 L 750 520" marker-end="url(#arrow-data)"/>
    <path d="M 1010 360 L 1010 520" marker-end="url(#arrow-data)"/>
  </g>

  <text x="60" y="685" font-size="12" fill="#6B7280">— — — Data flow (every 5 min, via vendor APIs)</text>
</svg>
