<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="1200" height="800" fill="#F5F1EB"/>

  <text x="60" y="68" font-size="14" font-weight="600" fill="#5D6670" letter-spacing="2.4">DIAGRAM 7 · DEDUP + THROTTLE</text>
  <text x="60" y="108" font-size="34" font-weight="700" fill="#1A1D23">Two independent gates. No spam. No buzz fatigue.</text>
  <text x="60" y="140" font-size="16" fill="#5D6670">Activity feed updates on signature change. Push fires on signature change AND ≥15 min since last push.</text>

  <!-- Axes labels -->
  <text x="640" y="220" font-size="14" font-weight="700" fill="#5D6670" letter-spacing="1.6" text-anchor="middle">SIGNATURE CHANGE?</text>
  <text x="120" y="450" font-size="14" font-weight="700" fill="#5D6670" letter-spacing="1.6" text-anchor="middle" transform="rotate(-90 120 450)">≥ 15 MIN SINCE LAST PUSH?</text>

  <!-- Column headers -->
  <text x="380" y="260" font-size="13" font-weight="700" fill="#1A1D23" text-anchor="middle">NO  ·  same recommendation</text>
  <text x="900" y="260" font-size="13" font-weight="700" fill="#1A1D23" text-anchor="middle">YES  ·  meaning changed</text>

  <!-- Row labels -->
  <text x="160" y="395" font-size="13" font-weight="700" fill="#1A1D23" text-anchor="end">YES</text>
  <text x="160" y="595" font-size="13" font-weight="700" fill="#1A1D23" text-anchor="end">NO</text>

  <!-- Quadrant 1 (top-left): no change, can push -->
  <g transform="translate(180,290)">
    <rect width="400" height="180" rx="18" fill="#FFFFFF" stroke="rgba(28,24,16,0.16)"/>
    <text x="20" y="44" font-size="13" font-weight="700" fill="#5D6670" letter-spacing="1.4">NOTHING FIRES</text>
    <text x="20" y="80" font-size="22" font-weight="700" fill="#1A1D23">Skip — same as last tick</text>
    <text x="20" y="110" font-size="13" fill="#5D6670">Engine recomputes recommendation, finds the</text>
    <text x="20" y="128" font-size="13" fill="#5D6670">signature unchanged. Activity feed and push</text>
    <text x="20" y="146" font-size="13" fill="#5D6670">both stay quiet. The most common state.</text>
  </g>

  <!-- Quadrant 2 (top-right): change, can push -->
  <g transform="translate(620,290)">
    <rect width="400" height="180" rx="18" fill="#1A1D23"/>
    <text x="20" y="44" font-size="13" font-weight="700" fill="#E89A2B" letter-spacing="1.4">FEED + PUSH</text>
    <text x="20" y="80" font-size="22" font-weight="700" fill="#FFFFFF">Log AND fire push</text>
    <text x="20" y="110" font-size="13" fill="rgba(255,255,255,0.78)">Meaningful state change AND we haven't</text>
    <text x="20" y="128" font-size="13" fill="rgba(255,255,255,0.78)">buzzed the user recently. Banner updates,</text>
    <text x="20" y="146" font-size="13" fill="rgba(255,255,255,0.78)">activity feed appends, push hits the lock screen.</text>
  </g>

  <!-- Quadrant 3 (bottom-left): no change, throttled -->
  <g transform="translate(180,490)">
    <rect width="400" height="180" rx="18" fill="#FFFFFF" stroke="rgba(28,24,16,0.16)"/>
    <text x="20" y="44" font-size="13" font-weight="700" fill="#5D6670" letter-spacing="1.4">NOTHING FIRES</text>
    <text x="20" y="80" font-size="22" font-weight="700" fill="#1A1D23">Skip — already quiet</text>
    <text x="20" y="110" font-size="13" fill="#5D6670">Same recommendation, recently pushed. The</text>
    <text x="20" y="128" font-size="13" fill="#5D6670">user already got the message; nothing to add.</text>
  </g>

  <!-- Quadrant 4 (bottom-right): change, throttled -->
  <g transform="translate(620,490)">
    <rect width="400" height="180" rx="18" fill="#FAF6EF" stroke="rgba(28,24,16,0.16)"/>
    <text x="20" y="44" font-size="13" font-weight="700" fill="#E89A2B" letter-spacing="1.4">FEED ONLY</text>
    <text x="20" y="80" font-size="22" font-weight="700" fill="#1A1D23">Log, no push</text>
    <text x="20" y="110" font-size="13" fill="#5D6670">Recommendation changed but we pushed less</text>
    <text x="20" y="128" font-size="13" fill="#5D6670">than 15 min ago. Banner updates within 30s,</text>
    <text x="20" y="146" font-size="13" fill="#5D6670">feed gets the entry, lock screen stays calm.</text>
  </g>

  <!-- Footnote -->
  <g transform="translate(60,710)">
    <text x="0" y="0" font-size="12" fill="#6B7280">Signature: stable string from recommendEvAction (e.g. stop:high:soc64). Embedded as [helios-sig:…] marker</text>
    <text x="0" y="20" font-size="12" fill="#6B7280">in the action's reason field — gives dedup without a schema migration. Stripped at the API edge before the UI sees it.</text>
  </g>
</svg>
